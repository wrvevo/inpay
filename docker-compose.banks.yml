name: inpay-banks
services:
  bank-mock-server:
    build:
      context: .
      args:
        MODULE: bank-mock-server
      target: spring-service
    environment:
      SERVER_PORT: "8098"
      INPAY_MOCK_PORT: "8099"
    ports:
      - 127.0.0.1:8098:8098
      - 127.0.0.1:8099:8099
  connector-c6:
    build:
      context: .
      args:
        MODULE: connector-c6
      target: spring-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8111"
      LOCAL_PASSWORD: ${LOCAL_PASSWORD:-local-only-change-me}
      BANK_MOCK_BASE_URL: http://bank-mock-server:8099
      BANK_MOCK_ENABLED: "true"
      BANK_ENABLED: "false"
    ports:
      - 127.0.0.1:8111:8111
    depends_on:
      - bank-mock-server
  connector-itau:
