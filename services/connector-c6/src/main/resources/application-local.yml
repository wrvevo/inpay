inpay:
  local-password: ${LOCAL_PASSWORD:local-only-change-me}
  local-merchant: 11111111-1111-1111-1111-111111111111
  c6:
    enabled: ${C6_ENABLED:false}
    kafka-enabled: ${C6_KAFKA_ENABLED:false}
    base-url: ${C6_BASE_URL:https://baas-api-sandbox.c6bank.info}
    client-id: ${C6_CLIENT_ID:}
    client-secret: ${C6_CLIENT_SECRET:}
    pix-key: ${C6_PIX_KEY:}
    certificate: ${C6_CERT_PATH:}
    private-key: ${C6_KEY_PATH:}
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${C6_KAFKA_ENABLED:false}
