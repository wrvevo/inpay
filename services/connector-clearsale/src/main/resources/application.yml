spring:
  application:
    name: connector-clearsale
  profiles:
    default: aws
server:
  port: 8128
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
inpay:
  clearsale:
    enabled: false
  security:
    issuer: ${COGNITO_ISSUER:}
    allowed-clients: ${COGNITO_ALLOWED_CLIENTS:}
    trusted-services: ${COGNITO_TRUSTED_SERVICES:}
    client-tenants: ${COGNITO_CLIENT_TENANTS:}
    audience: ${COGNITO_AUDIENCE:}
springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_1
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
