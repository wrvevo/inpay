spring:
  application:
    name: payment-core-service
  profiles:
    default: aws
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-core-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
server:
  port: 8084
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
inpay:
  journey:
    mode: ${INPAY_JOURNEY_MODE:disabled}
    connector-url: ${INPAY_JOURNEY_CONNECTOR_URL:}
    authorization: ${INPAY_JOURNEY_AUTHORIZATION:}
    sandbox-fixtures: ${INPAY_JOURNEY_SANDBOX_FIXTURES:false}
  security:
    issuer: ${COGNITO_ISSUER:}
    allowed-clients: ${COGNITO_ALLOWED_CLIENTS:}
    trusted-services: ${COGNITO_TRUSTED_SERVICES:}
    client-tenants: ${COGNITO_CLIENT_TENANTS:}
    audience: ${COGNITO_AUDIENCE:}
  outbox:
    delay: 2000

springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_1
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    persist-authorization: false
    display-request-duration: true
  override-with-generic-response: false
