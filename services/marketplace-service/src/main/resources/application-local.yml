spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace_service}
    username: ${DB_USER:marketplace_service}
    password: ${DB_PASSWORD:local-only}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
inpay:
  marketplace:
    enabled-tenants: ${MARKETPLACE_ENABLED_TENANTS:11111111-1111-1111-1111-111111111111}
  local-password: ${LOCAL_PASSWORD:local-only-change-me}
  local-merchant: 11111111-1111-1111-1111-111111111111

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Marketplace é explicitamente habilitado somente para o tenant de demonstração.
