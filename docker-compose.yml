    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: ${SERVICE_MEMORY_LIMIT:-512m}
    restart: unless-stopped
    image: inpay/connector-safrapay:0.2.0
    healthcheck:
      test:
      - CMD-SHELL
      - java -cp /app/health Healthcheck http://localhost:$$SERVER_PORT/actuator/health
      interval: 30s
      timeout: 10s
      start_period: 120s
