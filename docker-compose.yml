      SAFRAPAY_APP_KEY: "${SAFRAPAY_APP_KEY:-}"
      SAFRAPAY_API_VERSION: "${SAFRAPAY_API_VERSION:-2021-03-22}"
      SAFRAPAY_HOST: "${SAFRAPAY_HOST:-}"
      SAFRAPAY_CHANNEL: "${SAFRAPAY_CHANNEL:-}"
      SAFRAPAY_KEY_STORE: "${SAFRAPAY_KEY_STORE:-}"
