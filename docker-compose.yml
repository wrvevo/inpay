name: inpay
services:
  inpay-panel:
    build:
      context: ./frontend
    ports:
    - 127.0.0.1:3080:8080
    environment:
      PANEL_AUTH_MODE: local
      LOCAL_PASSWORD: ${LOCAL_PASSWORD:-inpay@123}
      PANEL_ORIGINS: http://localhost:3080,http://127.0.0.1:3080
      LINKS_URL: http://payment-links-service:8082
      QUERY_URL: http://transaction-query-service:8091
      FRAUD_URL: http://fraud-service:8087
      CREDITS_URL: http://credits-service:8110
      MARKETPLACE_URL: http://marketplace-service:8112
      BILLING_URL: http://billing-service:8113
      ACCOUNTS_URL: http://accounts-service:8111
      PAINEL_URL: http://painel-gerencial:8130
    restart: unless-stopped
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/local/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
    - kafka-data:/var/lib/kafka/data
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command:
    - --config=/etc/otel/config.yaml
    volumes:
    - ./infra/local/otel.yaml:/etc/otel/config.yaml:ro
    ports:
    - 127.0.0.1:4317:4317
    - 127.0.0.1:4318:4318
  prometheus:
    image: prom/prometheus:v3.6.0
    volumes:
    - ./infra/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - observability-config:/run/inpay-secrets:ro
    - prometheus-data:/prometheus
    ports:
    - 127.0.0.1:9090:9090
    restart: unless-stopped
    depends_on:
      observability-init:
        condition: service_completed_successfully
  grafana:
    image: grafana/grafana:12.2.0
    ports:
    - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: inpay
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-inpay@123}
    volumes:
    - ./infra/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/default.yaml:ro
    - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
  merchant-service:
    build:
      context: .
      args:
        MODULE: merchant-service
      target: spring-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/merchant_service
      DB_USER: merchant_service
      DB_PASSWORD: local-only
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LOCAL_PASSWORD: ${LOCAL_PASSWORD:-inpay@123}
      SERVER_PORT: '8081'
      OTEL_SERVICE_NAME: merchant-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=15
    ports:
    - 127.0.0.1:8081:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: ${SERVICE_MEMORY_LIMIT:-512m}
    restart: unless-stopped
    image: inpay/merchant-service:0.2.0
    healthcheck:
      test:
      - CMD-SHELL
      - java -cp /app/health Healthcheck http://localhost:$$SERVER_PORT/actuator/health
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10
    stop_grace_period: 30s
    security_opt:
    - no-new-privileges:true
