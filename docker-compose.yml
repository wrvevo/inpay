    stop_grace_period: 30s
    security_opt:
    - no-new-privileges:true
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/bash
    - /scripts/create-topics.sh
    volumes:
    - ./infra/local/create-topics.sh:/scripts/create-topics.sh:ro
    restart: 'no'
  observability-init:
    image: busybox:1.37.0
    environment:
      LOCAL_PASSWORD: ${LOCAL_PASSWORD:-inpay@123}
    volumes:
    - observability-config:/config
    command:
    - sh
    - -c
    - umask 022; printf '%s' "$$LOCAL_PASSWORD" > /config/api-password
    restart: 'no'
  lambda-webhook-forwarder:
