openapi: 3.1.0
info:
  title: InPay | token-service
  version: 0.2.0
  description: Exemplo estático. Consulte /v3/api-docs da aplicação para o contrato
    gerado pelos controllers.
servers:
- url: http://localhost:8086
  description: Desenvolvimento local
security:
- bearerAuth: []
- localBasic: []
paths:
  /internal/v1/module:
    get:
      summary: Metadados do scaffold
      description: Requer scope tokens/read
      responses:
        '200':
          description: Módulo e estágio de implementação
        '401':
          description: Não autenticado
        '403':
          description: Escopo ausente
  /local/v1/instruments:
    post:
      summary: 'Criar alias simulado: somente perfil local'
      description: Requer scope tokens/write. Consulte README para limitações.
      responses:
        '200':
          description: Resultado
        '401':
          description: Não autenticado
        '403':
          description: Escopo ou tenant não autorizado
        '409':
          description: Conflito de estado ou idempotência
        '422':
          description: Dados inválidos
      parameters:
      - in: header
        name: X-Merchant-Id
        required: false
        schema:
          type: string
          format: uuid
        description: Contexto autorizado; não autentica por si só.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                affiliationId:
                  type: string
              required:
              - provider
              - affiliationId
              additionalProperties: false
  /internal/v1/instruments/{token}:
    get:
      summary: Operação de instrumento simulado, somente profile local
      description: Requer tokens/resolve
      parameters: &id001
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resultado
        '403':
          description: Não autorizado
        '404':
          description: Não encontrado
  /v1/instruments/{token}:
    delete:
      summary: Operação de instrumento simulado, somente profile local
      description: Requer tokens/write
      parameters: *id001
      responses:
        '200':
          description: Resultado
        '403':
          description: Não autorizado
        '404':
          description: Não encontrado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    localBasic:
      type: http
      scheme: basic
      description: Somente profile local
