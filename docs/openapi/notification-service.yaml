openapi: 3.1.0
info:
  title: InPay | notification-service
  version: 0.2.0
  description: Exemplo estático. Consulte /v3/api-docs da aplicação para o contrato
    gerado pelos controllers.
servers:
- url: http://localhost:8090
  description: Desenvolvimento local
security:
- bearerAuth: []
- localBasic: []
paths:
  /internal/v1/module:
    get:
      summary: Metadados do scaffold
      description: Requer scope notifications/read
      responses:
        '200':
          description: Módulo e estágio de implementação
        '401':
          description: Não autenticado
        '403':
          description: Escopo ausente
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    localBasic:
      type: http
      scheme: basic
      description: Somente profile local
