openapi: 3.1.0
info:
  title: InPay | transaction-query-service
  version: 0.2.0
  description: Exemplo estático. Consulte /v3/api-docs da aplicação para o contrato
    gerado pelos controllers.
servers:
- url: http://localhost:8091
  description: Desenvolvimento local
security:
- bearerAuth: []
- localBasic: []
paths:
  /internal/v1/module:
    get:
      summary: Metadados do scaffold
      description: Requer scope transactions/read
      responses:
        '200':
          description: Módulo e estágio de implementação
        '401':
          description: Não autenticado
        '403':
          description: Escopo ausente
  /v1/transactions/{id}:
    get:
      summary: Consultar projeção Kafka
      description: Requer scope transactions/read. Consulte README para limitações.
      responses:
        '200':
          description: Resultado
        '401':
          description: Não autenticado
        '403':
          description: Escopo ou tenant não autorizado
        '409':
          description: Conflito de estado ou idempotência
        '422':
          description: Dados inválidos
      parameters:
      - in: header
        name: X-Merchant-Id
        required: false
        schema:
          type: string
          format: uuid
        description: Contexto autorizado; não autentica por si só.
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    localBasic:
      type: http
      scheme: basic
      description: Somente profile local
