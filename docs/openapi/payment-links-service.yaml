openapi: 3.1.0
info:
  title: payment-links-service
  version: 0.1.0
  description: Contratos do scaffold; não representa homologação financeira.
servers:
- url: http://localhost:8082
  description: Desenvolvimento local
security:
- bearerAuth: []
- localBasic: []
paths:
  /internal/v1/module:
    get:
      summary: Metadados do scaffold
      description: Requer scope links/read
      responses:
        '200':
          description: Módulo e estágio de implementação
        '401':
          description: Não autenticado
        '403':
          description: Escopo ausente
  /v1/payment-links:
    post:
      summary: Criar registro de link
      description: Requer scope links/write. Consulte README para limitações.
      responses:
        '200':
          description: Resultado
        '401':
          description: Não autenticado
        '403':
          description: Escopo ou tenant não autorizado
        '409':
          description: Conflito de estado ou idempotência
        '422':
          description: Dados inválidos
      parameters:
      - in: header
        name: X-Merchant-Id
        required: false
        schema:
          type: string
          format: uuid
        description: Contexto autorizado; não autentica por si só.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantOrderId:
                  type: string
                amount:
                  type: integer
                  minimum: 1
                expiresAt:
                  type: string
                  format: date-time
              required:
              - merchantOrderId
              - amount
              - expiresAt
              additionalProperties: false
  /v1/payment-links/{id}:
    get:
      summary: Consultar link
      description: Requer scope links/read. Consulte README para limitações.
      responses:
        '200':
          description: Resultado
        '401':
          description: Não autenticado
        '403':
          description: Escopo ou tenant não autorizado
        '409':
          description: Conflito de estado ou idempotência
        '422':
          description: Dados inválidos
      parameters:
      - in: header
        name: X-Merchant-Id
        required: false
        schema:
          type: string
          format: uuid
        description: Contexto autorizado; não autentica por si só.
      - &id001
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
  /v1/payment-links/{id}/revoke:
    post:
      summary: Revogar link
      description: Requer scope links/write. Consulte README para limitações.
      responses:
        '200':
          description: Resultado
        '401':
          description: Não autenticado
        '403':
          description: Escopo ou tenant não autorizado
        '409':
          description: Conflito de estado ou idempotência
        '422':
          description: Dados inválidos
      parameters:
      - in: header
        name: X-Merchant-Id
        required: false
        schema:
          type: string
          format: uuid
        description: Contexto autorizado; não autentica por si só.
      - *id001
  /internal/v1/links/expire:
    post:
      summary: Expirar links vencidos
      description: Requer scope links/write. Consulte README para limitações.
      responses:
        '200':
          description: Resultado
        '401':
          description: Não autenticado
        '403':
          description: Escopo ou tenant não autorizado
        '409':
          description: Conflito de estado ou idempotência
        '422':
          description: Dados inválidos
      parameters:
      - in: header
        name: X-Merchant-Id
        required: false
        schema:
          type: string
          format: uuid
        description: Contexto autorizado; não autentica por si só.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    localBasic:
      type: http
      scheme: basic
      description: Somente profile local
