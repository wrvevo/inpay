global:
  scrape_interval: 15s
scrape_configs:
- job_name: merchant-service
  metrics_path: /actuator/prometheus
  basic_auth:
    username: developer
    password: local-only-change-me
  static_configs:
  - targets:
    - merchant-service:8081
