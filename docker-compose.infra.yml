# Infraestrutura local para os módulos rodando no IntelliJ.
# Não sobe aplicações. Postgres em localhost:5432, Kafka em localhost:9092.
# Uso: docker compose -f docker-compose.infra.yml up -d
name: inpay-infra
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/local/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/local/otel.yaml:/etc/otel/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
    restart: unless-stopped
  observability-init:
    image: busybox:1.37.0
    environment:
      LOCAL_PASSWORD: ${LOCAL_PASSWORD:-inpay@123}
    volumes:
      - observability-config:/config
    command: ["sh", "-c", "umask 022; printf '%s' \"$$LOCAL_PASSWORD\" > /config/api-password"]
    restart: "no"
  prometheus:
    image: prom/prometheus:v3.6.0
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./infra/local/prometheus-host.yml:/etc/prometheus/prometheus.yml:ro
      - observability-config:/run/inpay-secrets:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    depends_on:
      observability-init:
        condition: service_completed_successfully
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: inpay
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-inpay@123}
    volumes:
      - ./infra/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/default.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres-data: {}
  kafka-data: {}
  observability-config: {}
  prometheus-data: {}
  grafana-data: {}
