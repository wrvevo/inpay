name: verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 scripts/verify-wiremock-intents.py
      - name: Check formatting (report all changes)
        run: mvn -B spotless:apply && git diff --exit-code --no-color
      - name: Verify Java modules
        if: always()
        run: mvn -B spotless:check verify

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verifica idempotência e recuperação de eventos no PostgreSQL
        run: mvn -B -pl services/payment-core-service -am -Pintegration verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Docker integration suite
        run: bash scripts/docker-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-e2e-results
          path: test-results/
          if-no-files-found: warn
