name: Package AWS demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package the static site
        run: cd dist && zip -qr ../inpay-demo.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: inpay-demo-${{ github.ref_name }}-${{ github.sha }}
          path: frontend/inpay-demo.zip
          if-no-files-found: error
          retention-days: 7
