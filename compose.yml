name: include-payment-gateway
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/local/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command:
    - --config=/etc/otel/config.yaml
    volumes:
    - ./infra/local/otel.yaml:/etc/otel/config.yaml:ro
    ports:
    - 127.0.0.1:4317:4317
    - 127.0.0.1:4318:4318
  prometheus:
    image: prom/prometheus:v3.6.0
    profiles:
    - observability
    volumes:
    - ./infra/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9090:9090
  grafana:
    image: grafana/grafana:12.2.0
    profiles:
    - observability
    ports:
    - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-only-change-me
    volumes:
    - ./infra/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/default.yaml:ro
  merchant-service:
    profiles:
    - apps
    build:
      context: .
      args:
        MODULE: merchant-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/merchant_service
      DB_USER: merchant_service
      DB_PASSWORD: local-only
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LOCAL_PASSWORD: ${LOCAL_PASSWORD:-local-only-change-me}
    ports:
    - 127.0.0.1:8081:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
  payment-links-service:
    profiles:
    - apps
